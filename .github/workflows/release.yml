name: Build and release

# Läuft automatisch, wenn core/version.py auf main geändert wird (also bei jeder neuen Version),
# oder manuell über "Run workflow". Legt das Release "v<APP_VERSION>" an, falls es noch nicht existiert.
on:
  push:
    branches: [main]
    paths: ["core/version.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Version aus dem Code lesen
        id: ver
        run: echo "version=$(python -c 'from core.version import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt pyinstaller

      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --clean --noconsole --onefile --name JaronsOPMakro
          --collect-all customtkinter --collect-submodules modules
          --hidden-import modules.autoclicker.plugin --collect-submodules pynput main.py

      - name: version.json erzeugen
        run: |
          NOTES=""
          if [ -f RELEASE_NOTES.txt ]; then NOTES="$(cat RELEASE_NOTES.txt)"; fi
          python tools/make_exe_release.py "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download" --notes "$NOTES"

      - uses: actions/upload-artifact@v4
        with:
          name: JaronsOPMakro
          path: |
            dist/JaronsOPMakro.exe
            dist/version.json

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG existiert schon. Bitte APP_VERSION in core/version.py erhöhen. EXE nur als Artefakt gespeichert."
            exit 0
          fi
          gh release create "$TAG" dist/JaronsOPMakro.exe dist/version.json \
            --target "${GITHUB_SHA}" --title "Version ${{ steps.ver.outputs.version }}" --notes-file RELEASE_NOTES.txt
